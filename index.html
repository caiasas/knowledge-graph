<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>知识图谱 · Knowledge Graph</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知识图谱">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ================= 顶栏 ================= -->
  <header class="topbar" id="topbar">
    <div class="brand" id="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 2.5 28 9.2v13.6L16 29.5 4 22.8V9.2z" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
          <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
          <circle cx="16" cy="7.4" r="1.9" fill="currentColor" opacity=".85"/>
          <circle cx="23.8" cy="20.4" r="1.9" fill="currentColor" opacity=".85"/>
          <circle cx="8.2" cy="20.4" r="1.9" fill="currentColor" opacity=".85"/>
          <path d="M16 9.3v3.5M18.8 17.6l3.2 1.8M13.2 17.6l-3.2 1.8" stroke="currentColor" stroke-width="1.2" opacity=".8"/>
        </svg>
      </span>
      <span class="brand-text">
        <b id="brand-title">知识图谱</b>
        <small>KNOWLEDGE&nbsp;GRAPH</small>
      </span>
    </div>

    <div class="search-wrap" id="search-wrap">
      <label class="search" id="search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="搜索知识点、标签、定义…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="搜索知识">
        <button class="search-clear" id="q-clear" type="button" aria-label="清空">✕</button>
        <kbd class="kbd-hint">/</kbd>
      </label>
      <div class="results" id="results" hidden></div>
    </div>

    <div class="actions">
      <button class="icon-btn only-coarse" id="btn-filter" type="button" aria-label="筛选">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="sync-dot" id="sync-dot" hidden title="云同步"></span>
      <button class="icon-btn" id="btn-install" type="button" aria-label="安装到设备" title="安装到设备" hidden>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="切换主题" title="切换主题">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="数据管理" title="数据管理">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5.5" r="1.7" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.7" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="18.5" r="1.7" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="btn primary" id="btn-add" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>新增</span>
      </button>
    </div>
  </header>

  <!-- ================= 画布 ================= -->
  <main class="stage" id="stage">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="halo-grad">
          <stop offset="0%" stop-color="#fff" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0 0 10 5 0 10z" fill="context-stroke"/>
        </marker>
        <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0 0 10 5 0 10z" fill="currentColor"/>
        </marker>
      </defs>
      <g id="viewport">
        <g id="rings"></g>
        <g id="clusters"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <div class="crumbs" id="crumbs" hidden></div>

    <div class="stage-hint" id="hint">
      <span class="pulse-dot"></span>
      点击任意圆点，展开它的下一级关系
    </div>

    <!-- 左侧筛选 -->
    <aside class="filters glass" id="filters" aria-label="筛选">
      <div class="filters-head">
        <h3>筛选</h3>
        <button class="chip-btn" id="filters-reset" type="button">重置</button>
      </div>
      <div class="filters-scroll">
      <div class="filters-body" id="filter-body">
        <div class="f-group">
          <div class="f-label">分类</div>
          <div class="chips" id="cat-chips"></div>
        </div>
        <div class="f-group">
          <div class="f-label">关系类型</div>
          <div class="chips" id="type-chips"></div>
        </div>
      </div>
      <div class="filters-body list-body" id="list-body">
        <div class="list-title">全部知识点</div>
        <div id="node-list"></div>
      </div>
      </div>
      <div class="filters-foot" id="stats"></div>
    </aside>

    <!-- 右下缩放 -->
    <div class="zoombar glass" id="zoombar">
      <button class="zbtn" data-zoom="in" aria-label="放大">＋</button>
      <button class="zbtn" data-zoom="out" aria-label="缩小">−</button>
      <button class="zbtn" data-zoom="fit" aria-label="适应画布">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="zbtn" data-zoom="overview" aria-label="回到全图">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><circle cx="5" cy="6" r="1.6" stroke="currentColor" stroke-width="1.5"/><circle cx="19" cy="6" r="1.6" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="18" r="1.6" stroke="currentColor" stroke-width="1.5"/><circle cx="19" cy="18" r="1.6" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>

    <div class="tip" id="tip" hidden></div>
    <div class="scrim" id="scrim" hidden></div>

    <!-- 详情面板 -->
    <aside class="panel" id="panel" aria-label="知识详情" hidden></aside>
  </main>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script src="assets/seed.js"></script>
<script src="assets/app.js"></script>
<script>
  // 离线可用：仅在 http(s) 下注册 Service Worker（file:// 不支持）
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
